<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel de Imagens</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Carrossel interativo usando uma lista circular duplamente encadeada</h2>
    <div class="container">
        
        <div class="carrossel-container">
            <button id="anterior-btn">◄</button>
            <div class="carrossel">
                <img src="./imagem01.jpg" alt="Imagem 1" class="carrossel-item active">
                <img src="./imagem02.jpg" alt="Imagem 2" class="carrossel-item">
                <img src="./imagem03.jpg" alt="Imagem 3" class="carrossel-item">
            </div>
            <button id="proximo-btn">►</button>
        </div>
    </div>
    <script src="main.js"></script>  
</body>
</html>
